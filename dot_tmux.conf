# tmux had no config here at all, so every machine started stock. These are the defaults
# worth changing rather than a full customisation.

# Wheel scrolling, and click to select a pane or window. Off by default.
# Note this makes tmux capture click-drag for its own selection, so the terminal's native
# copy stops working -- hold Shift while dragging to bypass tmux. That matters over SSH,
# where tmux's copy buffer lives on the remote machine and only the terminal's own selection
# reaches the local clipboard.
set -g mouse on

# 2000 lines is the default and does not survive a verbose build.
set -g history-limit 50000

# The default 500ms wait for an escape sequence makes Esc feel broken in nvim.
set -sg escape-time 10

# Windows are selected with Ctrl-b 1..9, so starting at 1 rather than 0 means the numbers
# match the keys. renumber-windows closes the gaps left when a middle window is killed.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Without these, truecolor is flattened to 256 colors inside tmux and colour schemes in nvim
# look subtly wrong -- a difference that is easy to blame on the theme instead.
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
