[".zsh/zsh-autosuggestions"]
    type = "git-repo"
    url = "https://github.com/zsh-users/zsh-autosuggestions.git"
    refreshPeriod = "168h"
    [".zsh/zsh-autosuggestions".pull]
        args = ["--ff-only"]

[".zsh/zsh-syntax-highlighting"]
    type = "git-repo"
    url = "https://github.com/zsh-users/zsh-syntax-highlighting.git"
    refreshPeriod = "168h"
    [".zsh/zsh-syntax-highlighting".pull]
        args = ["--ff-only"]

[".zsh/zsh-completions"]
    type = "git-repo"
    url = "https://github.com/zsh-users/zsh-completions.git"
    refreshPeriod = "168h"
    [".zsh/zsh-completions".pull]
        args = ["--ff-only"]

# tmux session persistence. Pinned to tags rather than tracking HEAD, and loaded straight from
# tmux.conf, so there is no tpm to install. Bump the tag to upgrade.
[".config/tmux/plugins/tmux-resurrect"]
    type = "archive"
    url = "https://github.com/tmux-plugins/tmux-resurrect/archive/refs/tags/v4.0.0.tar.gz"
    stripComponents = 1

[".config/tmux/plugins/tmux-continuum"]
    type = "archive"
    url = "https://github.com/tmux-plugins/tmux-continuum/archive/refs/tags/v3.1.0.tar.gz"
    stripComponents = 1
