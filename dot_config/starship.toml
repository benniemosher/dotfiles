# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

# The prompt design below is Omarchy's (config/starship.toml), adopted here so every machine
# gets it rather than only the Arch one. Ours adds the kubernetes module on top. Omarchy does
# not rewrite this file after install -- no migration mentions it and no bin/ script writes
# it -- so chezmoi owning it costs nothing there.

# Inserts a blank line between shell prompts
add_newline = true

# Omarchy sets 200ms. The kubernetes module shells out to read the current context, which
# does not reliably finish in that window, and a module that times out renders as nothing at
# all -- so the prompt would silently lose the context rather than look slow.
command_timeout = 5000

# $kubernetes sits outside the [...]($style) group on purpose: inside it, the group's style
# would override the module's own, and the cluster context is worth having its own colour.
# Omarchy's format is explicit, so a module absent from this string renders nowhere no matter
# how it is configured -- which is why enabling [kubernetes] alone is not enough.
format = "[$directory$git_branch$git_status]($style)$kubernetes$character"

[character]
error_symbol = "[✗](bold cyan)"
success_symbol = "[❯](bold cyan)"

[directory]
truncation_length = 2
truncation_symbol = "…/"
repo_root_style = "bold cyan"
repo_root_format = "[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "

[git_branch]
format = "[$branch]($style) "
style = "italic cyan"

[git_status]
format     = '[$all_status]($style)'
style      = "cyan"
ahead      = "⇡${count} "
diverged   = "⇕⇡${ahead_count}⇣${behind_count} "
behind     = "⇣${count} "
conflicted = " "
up_to_date = " "
untracked  = "? "
modified   = " "
stashed    = ""
staged     = ""
renamed    = ""
deleted    = ""

# Ours, not Omarchy's: the cluster context in the prompt is worth the shell-out.
[kubernetes]
disabled = false
# Explicit format, because starship's default for this module carries a prefix word ("in")
# that reads as dangling text when the module sits between the git group and the character.
format = '[$symbol$context]($style) '
symbol = '☸ '
style = 'bold cyan'

[container]
disabled = true
