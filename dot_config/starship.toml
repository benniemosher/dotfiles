# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

# Inserts a blank line between shell prompts
add_newline = true

# The kubernetes module shells out to read the current context. A module that times out
# renders as nothing at all, so too low a value silently drops the context from the prompt
# rather than making it look slow.
command_timeout = 5000

# This format string is explicit, so a module missing from it renders nowhere however it is
# configured -- enabling a module is not enough, it has to be named here. $kubernetes sits
# outside the [...]($style) group so the group's style does not override its own.
format = "$hostname[$directory$git_branch$git_status]($style)$kubernetes$character"

[character]
error_symbol = "[✗](bold cyan)"
success_symbol = "[❯](bold cyan)"

[directory]
truncation_length = 2
truncation_symbol = "…/"
repo_root_style = "bold cyan"
repo_root_format = "[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "

# Always shown, not only over SSH, so every terminal says which machine it is on. The SSH
# symbol still marks a remote session.
[hostname]
ssh_only = false
ssh_symbol = "🌐 "
format = "[$ssh_symbol$hostname]($style) "
style = "bold dimmed cyan"

[git_branch]
format = "[$branch]($style) "
style = "italic cyan"

[git_status]
format     = '[$all_status]($style)'
style      = "cyan"
ahead      = "⇡${count} "
diverged   = "⇕⇡${ahead_count}⇣${behind_count} "
behind     = "⇣${count} "
conflicted = " "
up_to_date = " "
untracked  = "? "
modified   = " "
stashed    = ""
staged     = ""
renamed    = ""
deleted    = ""

[kubernetes]
disabled = false
# Explicit format: the default carries a prefix word ("in") that reads as dangling text
# where this module sits, between the git group and the character.
format = '[$symbol$context]($style) '
symbol = '☸ '
style = 'bold cyan'

[container]
disabled = true
