## Keep Bluetooth headphones on the high-quality playback profile.
## WirePlumber normally switches them to the headset profile (HFP, mono, low quality) when an
## app starts recording. Microphone input comes from the MacBook mic or the Logitech webcam
## instead, so the switch would only make music sound worse.

wireplumber.settings = {
  bluetooth.autoswitch-to-headset-profile = false
}
