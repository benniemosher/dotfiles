packages:
  npm:
    work:
    personal:
      - "eas-cli"
  darwin:
    taps:
      work:
        - "alexnabokikh/tfsort"
        - "hashicorp/tap"
      personal:
        - "supabase/tap"
    brews:
      work:
        - "alexnabokikh/tfsort/tfsort"
        - "aria2"
        - "awscli"
        - "checkov"
        - "chezmoi"
        - "cowsay"
        - "defaultbrowser"
        - "figlet"
        - "fortune"
        - "fzf"
        - "gh"
        - "glab"
        - "gnupg"
        - "krew"
        - "kubernetes-cli"
        - "kubectx"
        - "kubeseal"
        - "kustomize"
        - "lolcat"
        - "mas"
        - "neovim"
        - "pinentry"
        - "pinentry-mac"
        - "pre-commit"
        - "shellcheck"
        - "starship"
        - "stern"
        - "terraform-ls"
        - "tree"
        - "yq"
      personal:
        - "argocd"
        - "cloudflared"
        - "supabase"
        - "tmux"
    casks:
      work:
        - "amethyst"
        - "docker-desktop"
        - "sequel-ace"
        - "sourcetree"
        - "visual-studio-code@insiders"
        - "wezterm"
      personal:
        - "1password"
        - "1password-cli"
        - "brave-browser"
        - "claude-code"
        - "grammarly-desktop"
        - "keybase"
        - "slack"
  # Same split as darwin above: `work` installs everywhere,
  # `personal` only on machines without `work_platform`, so a
  # personal machine gets work + personal.
  linux:
    apts:
      work:
        - "build-essential"
        - "ca-certificates"
        - "curl"
        - "fzf"
        - "gcc"
        - "gh"
        - "git"
        - "gnupg"
        - "jq"
        - "kubectx"
        # mise builds language runtimes from source; these are
        # what those builds link against.
        - "libffi-dev"
        - "libreadline-dev"
        - "libssl-dev"
        - "libyaml-dev"
        - "lsb-release"
        - "mailcap"
        - "neovim"
        - "pre-commit"
        - "shellcheck"
        - "tree"
        - "unzip"
        - "wget"
        # Installed, not just set: run_onchange_set-default-shell
        # runs on every OS and chsh fails without the shell present.
        - "zsh"
        - "zsh-autosuggestions"
        - "zlib1g-dev"
      personal:
        - "cowsay"
        - "figlet"
        - "fortune"
        - "lolcat"
    snaps:
      work:
        - "chezmoi"
        - "docker"
        - "k9s"
        # Unquoted in the install script, so the flag reaches snap
        # as its own argument.
        - "kubectl --classic"
      personal:
        - "1password"
        - "brave"
        - "keybase"
        - "slack"
