packages:
  npm:
    work:
    personal:
      - "eas-cli"
  darwin:
    taps:
      work:
        - "alexnabokikh/tfsort"
        - "hashicorp/tap"
      personal:
    brews:
      work:
        - "alexnabokikh/tfsort/tfsort"
        - "aria2"
        - "chezmoi"
        - "cowsay"
        - "defaultbrowser"
        - "figlet"
        - "fortune"
        - "fzf"
        - "gh"
        - "glab"
        - "gnupg"
        - "krew"
        - "kubernetes-cli"
        - "kubectx"
        - "kustomize"
        - "lolcat"
        - "mas"
        - "neovim"
        - "pinentry"
        - "pinentry-mac"
        - "pre-commit"
        - "shellcheck"
        - "starship"
        - "tree"
        - "yq"
      personal:
        - "tmux"
    casks:
      work:
        - "amethyst"
        - "docker-desktop"
        - "sequel-ace"
        - "sourcetree"
        - "visual-studio-code@insiders"
        - "wezterm"
      personal:
        - "1password"
        - "1password-cli"
        - "brave-browser"
        - "claude-code"
        - "grammarly-desktop"
        - "keybase"
        - "slack"
  # Same split as darwin above: `work` installs everywhere,
  # `personal` only on machines without `work_platform`, so a
  # personal machine gets work + personal.
  linux:
    apts:
      work:
        - "aria2"
        - "build-essential"
        - "ca-certificates"
        # Matching darwin, where these sit in `work` rather than `personal`.
        - "cowsay"
        - "curl"
        - "figlet"
        - "fortune"
        - "fzf"
        - "gcc"
        - "git"
        - "gnupg"
        - "jq"
        - "kubectx"
        - "lolcat"
        # darwin installs pinentry + pinentry-mac; this is the Linux half, and
        # gpg-agent.conf points at /usr/bin/pinentry to reach whichever is set.
        - "pinentry-curses"
        # mise builds language runtimes from source; these are
        # what those builds link against.
        - "libffi-dev"
        - "libreadline-dev"
        - "libssl-dev"
        - "libyaml-dev"
        - "lsb-release"
        - "mailcap"
        - "neovim"
        - "pre-commit"
        - "shellcheck"
        - "tree"
        - "unzip"
        - "wget"
        # Installed, not just set: run_onchange_set-default-shell
        # runs on every OS and chsh fails without the shell present.
        - "zsh"
        - "zsh-autosuggestions"
        - "zlib1g-dev"
      personal:
        - "tmux"
    snaps:
      work:
        # awscli, checkov and k9s are absent from every list here on
        # purpose: mise installs them (dot_config/mise/config.toml.tmpl).
        # Naming them in both put two binaries on PATH and let the winner
        # depend on ordering.
        #
        # chezmoi is deliberately absent: the README bootstrap
        # installs it to /usr/local/bin with the project's own
        # installer, and the snap needs --classic anyway.
        - "code --classic"
        - "docker"
        # Installed by the README bootstrap too; snap is idempotent about it.
        - "gh --classic"
        - "glab"
        - "kustomize"
        # Unquoted in the install script, so the flag reaches snap
        # as its own argument.
        - "kubectl --classic"
        - "yq"
      personal:
        - "1password"
        - "brave"
        - "keybase"
        # Official publisher (obsidianmd); classic confinement is
        # required. Verified on Ubuntu 26.04.
        - "obsidian --classic"
        - "slack"
