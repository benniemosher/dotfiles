---
packages:
  npm:
    work:
    personal:
      - "eas-cli"
  darwin:
    taps:
      work:
        - "alexnabokikh/tfsort"
        - "hashicorp/tap"
      personal:
    brews:
      work:
        - "aria2"
        # chezmoi is deliberately absent, as it is on Linux: the README
        # bootstrap installs it with Homebrew before the first apply.
        # Listing it here let `brew bundle` upgrade chezmoi from inside
        # the script that `chezmoi apply` was running, which unlinked the
        # running binary and left no chezmoi on PATH. Upgrade it on its
        # own with `brew upgrade chezmoi`.
        - "cowsay"
        - "defaultbrowser"
        - "figlet"
        - "fortune"
        - "fzf"
        - "gh"
        - "glab"
        - "gnupg"
        - "krew"
        - "kubernetes-cli"
        - "kubectx"
        - "kustomize"
        - "lolcat"
        - "mas"
        - "neovim"
        - "pinentry"
        - "pinentry-mac"
        - "pre-commit"
        - "shellcheck"
        - "starship"
        - "tmux"
        - "tree"
        - "yq"
      personal:
    casks:
      work:
        # A cask, not a formula: the tap donated its formula to homebrew-core
        # (see its tap_migrations.json) and now ships only this cask. Under
        # brews: it fails outright -- "No available formula with the name
        # ... Found a cask ... instead" -- which is why it was dropped in #80.
        # The core formula has no bottles on any platform, so it would compile
        # with Go on every upgrade; the cask is a prebuilt binary.
        - "alexnabokikh/tfsort/tfsort"
        - "amethyst"
        - "docker-desktop"
        - "freelens"
        # Every machine, work included: workspace-init sets each workspace's
        # notes/ up as an Obsidian vault.
        - "obsidian"
        - "sequel-ace"
        - "sourcetree"
        - "visual-studio-code@insiders"
        - "wezterm"
      personal:
        - "1password"
        - "1password-cli"
        - "brave-browser"
        - "claude-code"
        - "grammarly-desktop"
        - "keybase"
        - "slack"
  # Arch, and therefore Omarchy, which is Arch underneath. Same
  # work/personal split as the lists above. The installer script picks
  # this branch off osRelease.id, so a Debian/Ubuntu box still gets the
  # apts/snaps lists below.
  arch:
    pacmans:
      work:
        - "aria2"
        # Arch's equivalent of build-essential. mise compiles language runtimes
        # from source and needs a toolchain present before it runs.
        - "base-devel"
        - "ca-certificates"
        - "cowsay"
        - "curl"
        - "docker"
        - "docker-compose"
        - "figlet"
        # Debian calls this `fortune`; Arch ships the same thing as fortune-mod.
        - "fortune-mod"
        - "fzf"
        - "git"
        # `gh` on Debian/snap, github-cli here. Not left to mise: the mise
        # config does not list gh, and the ~/.local/bin/gh seen on one machine
        # is an on-demand shim (`mise use -g gh` then exec) that registered gh
        # in mise's own config on first use -- not something this repo deploys.
        # Which of several gh binaries git uses is settled in
        # dot_config/git/config.tmpl, not by leaving one of them uninstalled.
        - "github-cli"
        - "glab"
        - "gnupg"
        - "jq"
        - "kubectl"
        - "kubectx"
        - "kustomize"
        - "lolcat"
        - "lsb-release"
        - "mailcap"
        - "neovim"
        # In `extra`, so no AUR build needed -- unlike the snap, which wanted
        # --classic.
        - "obsidian"
        # Arch's pinentry package is the whole suite including the curses
        # variant, so there is no separate pinentry-curses to name. gpg-
        # agent.conf points at /usr/bin/pinentry and picks up whichever is
        # configured.
        - "pinentry"
        - "pre-commit"
        - "shellcheck"
        - "starship"
        - "tree"
        - "unzip"
        - "wget"
        # mise builds runtimes from source; these are what those builds link
        # against. Arch has no separate -dev packages -- headers ship with the
        # library.
        - "libffi"
        - "libyaml"
        - "openssl"
        - "readline"
        - "xz"
        - "zlib"
        # NOT "yq": in Arch's repos that name is the Python wrapper around jq.
        # Mike Farah's Go implementation -- the one the Brewfile and the snap
        # list install, and the one every script here is written against -- is
        # packaged as go-yq.
        - "go-yq"
        # Omarchy's own zsh support, from its package repo: the shared shell
        # config (aliases, functions, envs, tool init) plus zsh options,
        # keybindings and completions. dot_zshrc sources what this installs.
        # Pulls zsh itself, which set-default-shell needs present before chsh.
        - "omarchy-zsh"
        - "zsh-autosuggestions"
      personal:
        - "tmux"
    # Built from source by an AUR helper, so each one costs time on first apply.
    # Anything available in the official repos belongs in pacmans above instead.
    aurs:
      work:
        - "freelens-bin"
        - "visual-studio-code-insiders-bin"
      personal:
        # The AUR package pulls 1Password's own official Linux build, which --
        # unlike the snap and flatpak -- can expose the SSH agent socket and
        # talk to the CLI. Same reasoning as the .deb on Debian; see
        # run_onchange_linux-install-1password.
        - "1password"
        - "1password-cli"
        - "brave-bin"
        - "keybase-bin"
        - "slack-desktop"
        # Deliberately absent, with no Linux equivalent to swap in:
        #   grammarly-desktop  -- browser extension only, no Linux app exists
        #   sequel-ace         -- macOS only; dbeaver or beekeeper-studio
        #   sourcetree         -- macOS only; lazygit, or the gh/glab CLIs
        #   amethyst           -- Hyprland is the tiling WM on Omarchy
        #   docker-desktop     -- native docker (in pacmans) instead
        #   wezterm            -- Omarchy's terminal, so its theming applies
  # Same split as darwin above: `work` installs everywhere, `personal` only on
  # machines without `work_platform`, so a personal machine gets work +
  # personal.
  linux:
    apts:
      work:
        - "aria2"
        - "build-essential"
        - "ca-certificates"
        # Matching darwin, where these sit in `work` rather than `personal`.
        - "cowsay"
        - "curl"
        - "figlet"
        # The real package. `fortune` is a virtual name for it: apt
        # resolves it, but dpkg never records it as installed, so the
        # install script would treat it as always missing.
        - "fortune-mod"
        - "fzf"
        - "gcc"
        - "git"
        - "gnupg"
        - "jq"
        - "kubectx"
        - "lolcat"
        # darwin installs pinentry + pinentry-mac; this is the Linux half, and
        # gpg-agent.conf points at /usr/bin/pinentry to reach whichever is set.
        - "pinentry-curses"
        # mise builds language runtimes from source; these are
        # what those builds link against.
        - "libffi-dev"
        - "libreadline-dev"
        - "libssl-dev"
        - "libyaml-dev"
        - "lsb-release"
        - "mailcap"
        - "neovim"
        - "pre-commit"
        - "shellcheck"
        # From apt, not snap: the snap remaps $HOME into ~/snap, so it
        # never reads ~/.config/starship.toml and shows the default prompt.
        - "starship"
        - "tmux"
        - "tree"
        - "unzip"
        - "wget"
        # Installed, not just set: run_onchange_set-default-shell
        # runs on every OS and chsh fails without the shell present.
        - "zsh"
        - "zsh-autosuggestions"
        - "zlib1g-dev"
      personal:
    snaps:
      work:
        # awscli, checkov and k9s are absent from every list here on
        # purpose: mise installs them (dot_config/mise/config.toml.tmpl).
        # Naming them in both put two binaries on PATH and let the winner
        # depend on ordering.
        #
        # chezmoi is deliberately absent: the README bootstrap
        # installs it to /usr/local/bin with the project's own
        # installer, and the snap needs --classic anyway.
        - "code --classic"
        - "docker"
        # Installed by the README bootstrap too; snap is idempotent about it.
        - "gh --classic"
        - "glab"
        - "kustomize"
        # Unquoted in the install script, so the flag reaches snap
        # as its own argument.
        - "kubectl --classic"
        # Official publisher (obsidianmd); classic confinement is
        # required. Verified on Ubuntu 26.04. In work, matching the darwin
        # cask: workspace-init sets each workspace's notes/ up as a vault.
        - "obsidian --classic"
        - "yq"
      personal:
        # 1Password is NOT here: the snap and flatpak builds are sandboxed and
        # cannot expose the SSH agent socket or talk to the CLI. The .deb from
        # 1Password's own repo can, and that is what
        # run_onchange_linux-install-1password.sh installs.
        - "brave"
        - "keybase"
        - "slack"
